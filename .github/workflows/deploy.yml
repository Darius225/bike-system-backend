name: CI/CD Pipeline

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Use your Node.js version

      - name: Install dependencies
        run: npm install

      - name: Run E2E tests
        env:
          GBFS_SERVICE_BASE_URL: ${{ secrets.GBFS_SERVICE_BASE_URL }}
        run: npm run test:e2e

  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: success() # Only deploy if e2e-tests job succeeded
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: ~/.docker
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build and tag Docker image
        run: |
          docker build -t bicycle-system-backend:latest .

      - name: Tag Docker image for Artifact Registry
        run: |
          docker tag bicycle-system-backend:latest europe-north1-docker.pkg.dev/powerinbycicles/powertobycicles/bicycle-system-backend:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v0.7.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet

      - name: Push Docker image to Google Artifact Registry
        run: |
          docker push europe-north1-docker.pkg.dev/powerinbycicles/powertobycicles/bicycle-system-backend:latest
